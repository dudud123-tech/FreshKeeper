<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오늘까지야 DBNet Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    :root {
      color: #111916;
      background: #f7f8f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    p {
      color: #66706b;
      line-height: 1.5;
    }
    .panel {
      background: #fff;
      border: 1px solid #e1e6e2;
      border-radius: 14px;
      padding: 18px;
      margin: 16px 0;
      box-shadow: 0 10px 30px rgba(23, 44, 35, 0.06);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      align-items: end;
    }
    label {
      display: grid;
      gap: 8px;
      font-weight: 800;
    }
    input, select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #dbe2de;
      padding: 10px 12px;
      background: #fff;
    }
    button {
      cursor: pointer;
      background: #19845e;
      border-color: #19845e;
      color: #fff;
      font-weight: 900;
    }
    button.secondary {
      background: #eef7f2;
      border-color: #bde2d2;
      color: #116246;
    }
    canvas {
      max-width: 100%;
      height: auto;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e1e6e2;
    }
    .status {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #32413b;
      background: #f2f5f3;
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>DBNet 텍스트 박스 실험실</h1>
    <p>영수증 이미지를 DBNet 계열 ONNX 모델로 돌려 텍스트 박스가 실제 글자 위에 잘 잡히는지 확인합니다.</p>

    <section class="panel controls">
      <label>
        ONNX 모델
        <input id="modelInput" type="file" accept=".onnx" />
      </label>
      <label>
        영수증 이미지
        <input id="imageInput" type="file" accept="image/*" />
      </label>
      <label>
        입력 크기
        <select id="inputSize">
          <option value="640">640 x 640</option>
          <option value="736">736 x 736</option>
          <option value="960">960 x 960</option>
        </select>
      </label>
      <label>
        확률 기준
        <input id="threshold" type="number" min="0.05" max="0.95" step="0.05" value="0.35" />
      </label>
      <button id="runButton">검출 실행</button>
      <button id="saveButton" class="secondary" type="button">JSON 저장</button>
    </section>

    <section class="panel">
      <canvas id="canvas"></canvas>
    </section>

    <section class="panel">
      <div id="status" class="status">모델과 이미지를 선택하세요.</div>
    </section>
  </main>

  <script>
    const modelInput = document.getElementById("modelInput");
    const imageInput = document.getElementById("imageInput");
    const inputSize = document.getElementById("inputSize");
    const thresholdInput = document.getElementById("threshold");
    const runButton = document.getElementById("runButton");
    const saveButton = document.getElementById("saveButton");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusBox = document.getElementById("status");

    let sourceImage = null;
    let lastBoxes = [];

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files?.[0];
      if (!file) return;
      sourceImage = await loadImage(file);
      canvas.width = sourceImage.naturalWidth;
      canvas.height = sourceImage.naturalHeight;
      drawImageWithBoxes([]);
      status(`이미지 로드: ${sourceImage.naturalWidth} x ${sourceImage.naturalHeight}`);
    });

    runButton.addEventListener("click", runDetection);
    saveButton.addEventListener("click", saveJson);

    async function runDetection() {
      const modelFile = modelInput.files?.[0];
      if (!modelFile || !sourceImage) {
        status("ONNX 모델과 이미지를 먼저 선택하세요.");
        return;
      }

      const size = Number(inputSize.value);
      const threshold = Number(thresholdInput.value);
      status("모델 로드 중...");

      const modelBuffer = await modelFile.arrayBuffer();
      const session = await ort.InferenceSession.create(modelBuffer, { executionProviders: ["wasm"] });
      const inputName = session.inputNames[0];
      const outputName = session.outputNames[0];
      const tensor = imageToTensor(sourceImage, size);

      status(`추론 중...\ninput=${inputName}, output=${outputName}`);
      const started = performance.now();
      const results = await session.run({ [inputName]: tensor });
      const elapsed = Math.round(performance.now() - started);
      const output = results[outputName];
      const boxes = probabilityMapToBoxes(output, threshold, sourceImage.naturalWidth, sourceImage.naturalHeight);

      lastBoxes = boxes;
      drawImageWithBoxes(boxes);
      status(`완료: ${elapsed}ms\n박스 ${boxes.length}개\n출력 dims: ${JSON.stringify(output.dims)}\n\n${JSON.stringify(boxes.slice(0, 20), null, 2)}`);
    }

    function imageToTensor(image, size) {
      const workCanvas = document.createElement("canvas");
      workCanvas.width = size;
      workCanvas.height = size;
      const workCtx = workCanvas.getContext("2d");
      workCtx.fillStyle = "#fff";
      workCtx.fillRect(0, 0, size, size);
      const scale = Math.min(size / image.naturalWidth, size / image.naturalHeight);
      const drawWidth = Math.round(image.naturalWidth * scale);
      const drawHeight = Math.round(image.naturalHeight * scale);
      const offsetX = Math.floor((size - drawWidth) / 2);
      const offsetY = Math.floor((size - drawHeight) / 2);
      workCtx.drawImage(image, offsetX, offsetY, drawWidth, drawHeight);

      const pixels = workCtx.getImageData(0, 0, size, size).data;
      const data = new Float32Array(1 * 3 * size * size);
      const mean = [0.485, 0.456, 0.406];
      const std = [0.229, 0.224, 0.225];
      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          const src = (y * size + x) * 4;
          const dst = y * size + x;
          data[dst] = (pixels[src] / 255 - mean[0]) / std[0];
          data[size * size + dst] = (pixels[src + 1] / 255 - mean[1]) / std[1];
          data[size * size * 2 + dst] = (pixels[src + 2] / 255 - mean[2]) / std[2];
        }
      }
      const tensor = new ort.Tensor("float32", data, [1, 3, size, size]);
      tensor.meta = { scale, offsetX, offsetY, inputSize: size };
      return tensor;
    }

    function probabilityMapToBoxes(output, threshold, imageWidth, imageHeight) {
      const dims = output.dims;
      const data = output.data;
      const h = dims[dims.length - 2];
      const w = dims[dims.length - 1];
      if (!h || !w) return [];

      const visited = new Uint8Array(w * h);
      const boxes = [];
      const minArea = Math.max(6, Math.floor((w * h) * 0.00003));

      for (let y = 0; y < h; y += 1) {
        for (let x = 0; x < w; x += 1) {
          const idx = y * w + x;
          if (visited[idx] || data[idx] < threshold) continue;
          const component = floodFill(data, visited, w, h, x, y, threshold);
          if (component.area < minArea) continue;

          const box = mapBoxToImage(component, w, h, imageWidth, imageHeight);
          if (box.width < 8 || box.height < 5) continue;
          if (box.width > imageWidth * 0.98 || box.height > imageHeight * 0.3) continue;
          boxes.push(box);
        }
      }

      return mergeNearbyBoxes(boxes)
        .sort((a, b) => a.y - b.y || a.x - b.x)
        .map((box, index) => ({ id: `dbnet-${index}`, ...box }));
    }

    function floodFill(data, visited, w, h, startX, startY, threshold) {
      const queue = [[startX, startY]];
      let minX = startX;
      let minY = startY;
      let maxX = startX;
      let maxY = startY;
      let area = 0;
      let scoreSum = 0;
      visited[startY * w + startX] = 1;

      while (queue.length) {
        const [x, y] = queue.pop();
        const idx = y * w + x;
        area += 1;
        scoreSum += data[idx];
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;

        for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const nextIdx = ny * w + nx;
          if (visited[nextIdx] || data[nextIdx] < threshold) continue;
          visited[nextIdx] = 1;
          queue.push([nx, ny]);
        }
      }

      return { minX, minY, maxX, maxY, area, score: scoreSum / Math.max(1, area) };
    }

    function mapBoxToImage(component, mapWidth, mapHeight, imageWidth, imageHeight) {
      const x = Math.round((component.minX / mapWidth) * imageWidth);
      const y = Math.round((component.minY / mapHeight) * imageHeight);
      const width = Math.round(((component.maxX - component.minX + 1) / mapWidth) * imageWidth);
      const height = Math.round(((component.maxY - component.minY + 1) / mapHeight) * imageHeight);
      return { x, y, width, height, score: Number(component.score.toFixed(4)) };
    }

    function mergeNearbyBoxes(boxes) {
      const sorted = [...boxes].sort((a, b) => a.y - b.y || a.x - b.x);
      const merged = [];
      for (const box of sorted) {
        const target = merged.find((item) => {
          const sameLine = Math.abs(centerY(item) - centerY(box)) < Math.max(item.height, box.height) * 0.65;
          const near = box.x <= item.x + item.width + 12 && item.x <= box.x + box.width + 12;
          return sameLine && near;
        });
        if (!target) {
          merged.push({ ...box });
          continue;
        }
        const x1 = Math.min(target.x, box.x);
        const y1 = Math.min(target.y, box.y);
        const x2 = Math.max(target.x + target.width, box.x + box.width);
        const y2 = Math.max(target.y + target.height, box.y + box.height);
        target.x = x1;
        target.y = y1;
        target.width = x2 - x1;
        target.height = y2 - y1;
        target.score = Math.max(target.score, box.score);
      }
      return merged;
    }

    function centerY(box) {
      return box.y + box.height / 2;
    }

    function drawImageWithBoxes(boxes) {
      if (!sourceImage) return;
      canvas.width = sourceImage.naturalWidth;
      canvas.height = sourceImage.naturalHeight;
      ctx.drawImage(sourceImage, 0, 0);
      ctx.lineWidth = Math.max(2, Math.round(canvas.width / 360));
      ctx.font = `${Math.max(14, Math.round(canvas.width / 42))}px sans-serif`;
      boxes.forEach((box, index) => {
        ctx.strokeStyle = "#8b5cf6";
        ctx.fillStyle = "rgba(139, 92, 246, 0.16)";
        ctx.fillRect(box.x, box.y, box.width, box.height);
        ctx.strokeRect(box.x, box.y, box.width, box.height);
        ctx.fillStyle = "#5b21b6";
        ctx.fillText(String(index + 1), box.x + 4, Math.max(14, box.y - 4));
      });
    }

    function saveJson() {
      const blob = new Blob([JSON.stringify({ boxes: lastBoxes }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "dbnet-boxes.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = URL.createObjectURL(file);
      });
    }

    function status(message) {
      statusBox.textContent = message;
    }
  </script>
</body>
</html>
