<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>식품안전나라 품목제조보고 API 테스트</title>
  <style>
    :root {
      color: #17201c;
      background: #f6f8f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }

    body {
      margin: 0;
      padding: 28px;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 0 0 24px;
      color: #63706a;
      line-height: 1.55;
    }

    .panel {
      background: #fff;
      border: 1px solid #e1e7e4;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(15, 48, 36, 0.06);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 0.7fr 0.7fr;
      gap: 12px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 7px;
      color: #49554f;
      font-size: 13px;
      font-weight: 800;
    }

    input {
      min-height: 42px;
      border: 1px solid #dce3df;
      border-radius: 12px;
      padding: 0 12px;
      color: #17201c;
      font-size: 15px;
      font-weight: 650;
      outline: none;
    }

    input:focus {
      border-color: #1f7a5a;
      box-shadow: 0 0 0 3px rgba(31, 122, 90, 0.12);
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: #1f7a5a;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    button.secondary {
      background: #ecf5f1;
      color: #14583f;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 10px;
      margin-top: 12px;
    }

    .hint {
      margin: 14px 0 0;
      color: #78837d;
      font-size: 13px;
      line-height: 1.55;
    }

    .status {
      margin: 18px 0 10px;
      color: #14583f;
      font-weight: 900;
      min-height: 24px;
    }

    .urlBox {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: #f4f6f5;
      color: #4d5953;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      word-break: break-all;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid #edf0ee;
      padding: 11px 10px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
      line-height: 1.45;
    }

    th {
      color: #14583f;
      background: #eff8f4;
      font-size: 12px;
      white-space: nowrap;
    }

    td.product {
      color: #17201c;
      font-weight: 900;
      min-width: 180px;
    }

    .empty {
      padding: 28px;
      color: #7c8781;
      text-align: center;
      background: #fff;
      border: 1px dashed #dce3df;
      border-radius: 14px;
    }

    a {
      color: #1f7a5a;
      font-weight: 800;
    }

    @media (max-width: 820px) {
      body {
        padding: 16px;
      }

      .grid,
      .actions {
        grid-template-columns: 1fr;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>식품안전나라 품목제조보고 API 테스트</h1>
    <p class="sub">
      제품명이나 품목유형으로 식품안전나라 <strong>I1250 식품(첨가물)품목제조보고</strong> 데이터를 조회합니다.
      인증키는 브라우저 localStorage에만 저장됩니다.
    </p>

    <section class="panel">
      <div class="grid">
        <label>
          인증키
          <input id="apiKey" autocomplete="off" placeholder="식품안전나라 OpenAPI 인증키">
        </label>
        <label>
          제품명 검색어
          <input id="productName" placeholder="예: 우유, 고추장, 돼지불고기">
        </label>
        <label>
          품목유형
          <input id="typeName" placeholder="예: 소스">
        </label>
        <label>
          조회 건수
          <input id="limit" type="number" min="1" max="1000" value="20">
        </label>
      </div>

      <div class="actions">
        <button id="searchButton">조회하기</button>
        <button id="sampleButton" class="secondary">샘플키로 보기</button>
      </div>

      <p class="hint">
        호출 제한은 공식 문서 기준 일 2,000회이며, 한 번에 최대 1,000건까지 요청할 수 있습니다.
        브라우저 CORS 정책으로 조회가 막히면 아래 생성된 URL을 새 탭에서 직접 열어 확인하세요.
        공식 문서:
        <a href="https://www.foodsafetykorea.go.kr/api/openApiInfo.do?menu_grp=MENU_GRP31&amp;menu_no=656&amp;show_cnt=10&amp;start_idx=1&amp;svc_no=I1250&amp;svc_type_cd=API_TYPE06" target="_blank" rel="noreferrer">식품안전나라 I1250</a>
      </p>

      <div id="requestUrl" class="urlBox"></div>
    </section>

    <div id="status" class="status"></div>
    <div id="results" class="empty">검색어를 입력하고 조회해 주세요.</div>
  </main>

  <script>
    const API_HOST = "http://openapi.foodsafetykorea.go.kr/api";
    const SERVICE_ID = "I1250";
    const STORAGE_KEY = "freshkeeper-food-safety-api-key";

    const $ = (id) => document.getElementById(id);

    $("apiKey").value = localStorage.getItem(STORAGE_KEY) || "";
    $("productName").value = "우유";
    $("requestUrl").textContent = buildUrl({ dryRun: true });

    $("searchButton").addEventListener("click", () => runSearch(false));
    $("sampleButton").addEventListener("click", () => runSearch(true));
    ["apiKey", "productName", "typeName", "limit"].forEach((id) => {
      $(id).addEventListener("input", () => {
        $("requestUrl").textContent = buildUrl({ dryRun: true });
      });
      $(id).addEventListener("keydown", (event) => {
        if (event.key === "Enter") runSearch(false);
      });
    });

    function buildUrl({ useSample = false, dryRun = false } = {}) {
      const key = useSample ? "sample" : $("apiKey").value.trim();
      const limit = clamp(Number($("limit").value || 20), 1, 1000);
      const productName = $("productName").value.trim();
      const typeName = $("typeName").value.trim();
      const params = [];

      if (productName) params.push(`PRDLST_NM=${encodeURIComponent(productName)}`);
      if (typeName) params.push(`PRDLST_DCNM=${encodeURIComponent(typeName)}`);

      const base = `${API_HOST}/${key || "{인증키}"}/${SERVICE_ID}/json/1/${limit}`;
      if (dryRun && !params.length) return base;
      return params.length ? `${base}/${params.join("&")}` : base;
    }

    async function runSearch(useSample) {
      const key = $("apiKey").value.trim();
      if (!useSample && !key) {
        alert("인증키를 입력하거나 샘플키로 보기를 눌러주세요.");
        return;
      }

      if (key) localStorage.setItem(STORAGE_KEY, key);

      const url = buildUrl({ useSample });
      $("requestUrl").innerHTML = `<a href="${escapeAttribute(url)}" target="_blank" rel="noreferrer">${escapeHtml(url)}</a>`;
      $("status").textContent = "조회 중...";
      $("results").innerHTML = "";

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();
        renderResult(json);
      } catch (error) {
        $("status").textContent = "브라우저에서 직접 호출하지 못했습니다.";
        $("results").innerHTML = `
          <div class="empty">
            ${escapeHtml(error.message || String(error))}<br>
            CORS 또는 네트워크 정책 문제일 수 있습니다. 위 URL을 새 탭에서 열어 확인해 보세요.
          </div>
        `;
      }
    }

    function renderResult(json) {
      const service = json && json[SERVICE_ID];
      const rows = Array.isArray(service?.row) ? service.row : [];
      const result = service?.RESULT || {};

      if (!rows.length) {
        $("status").textContent = `${result.CODE || "NO_DATA"} · ${result.MSG || "조회 결과가 없습니다."}`;
        $("results").innerHTML = `<div class="empty">조회 결과가 없습니다.</div>`;
        return;
      }

      $("status").textContent = `${rows.length}건 조회됨`;
      $("results").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>제품명</th>
              <th>품목유형</th>
              <th>소비기한</th>
              <th>품질유지기한</th>
              <th>업소명</th>
              <th>보고번호</th>
              <th>최종수정</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((row) => `
              <tr>
                <td class="product">${escapeHtml(row.PRDLST_NM)}</td>
                <td>${escapeHtml(row.PRDLST_DCNM)}</td>
                <td>${escapeHtml(row.POG_DAYCNT)}</td>
                <td>${escapeHtml(row.QLITY_MNTNC_TMLMT_DAYCNT)}</td>
                <td>${escapeHtml(row.BSSH_NM)}</td>
                <td>${escapeHtml(row.PRDLST_REPORT_NO)}</td>
                <td>${escapeHtml(row.LAST_UPDT_DTM)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function clamp(value, min, max) {
      if (!Number.isFinite(value)) return min;
      return Math.max(min, Math.min(max, value));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }
  </script>
</body>
</html>
